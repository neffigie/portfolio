<li class="pinned-entry" data-pinned-entry>
	<div>
		<a href="{{ .RelPermalink }}">{{ .Title }}</a>
		{{ with .Params.previewText }}<p>{{ . }}</p>{{ end }}
	</div>
	<div class="pinned-entry-meta">
		<span>{{ .Params.postKind }}</span>
		<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
	</div>
</li>
