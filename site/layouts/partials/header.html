<header class="site-header">
	{{ $path := .RelPermalink }}
	{{ $homeActive := .IsHome }}
	{{ $resumeActive := eq $path "/resume/" }}
	{{ $postsActive := or (eq $path "/posts/") (strings.HasPrefix $path "/p/") }}
	<div class="site-frame site-header-inner">
		<a class="site-identity" href="/" aria-label="home">
			{{ partial "brand-mark.html" (dict "name" "header" "class" "site-mark" "alt" "") }}
		</a>
		<nav class="primary-navigation-wrap" aria-label="primary">
			<ul class="primary-navigation">
				<li><a href="/"{{ if $homeActive }} aria-current="page"{{ end }}>home</a></li>
				<li><a href="/resume/"{{ if $resumeActive }} aria-current="page"{{ end }}>resume</a></li>
				<li><a href="/posts/"{{ if $postsActive }} aria-current="page"{{ end }}>posts</a></li>
			</ul>
		</nav>
		<button class="search-launcher" type="button" aria-label="search" aria-haspopup="dialog" aria-controls="search-everywhere" data-search-open>
			<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
		</button>
	</div>
</header>
