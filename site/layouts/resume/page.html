{{ define "main" }}
<main class="site-main page-main-centered" id="main-content">

		<h1>{{ .Title }}</h1>
		<p><a class="resume-download" href="{{ .Params.asset.path }}" download>Download résumé (PDF)</a></p>

			<div class="prose">{{ . }}</div>
		{{ end }}
	</article>
</main>
{{ end }}
