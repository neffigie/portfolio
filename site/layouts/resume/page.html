{{ define "main" }}
<main class="site-main page-main-centered" id="main-content">
	<article class="reserved-page reading-column centered-content">
		<h1>{{ .Title }}</h1>
		<p><a class="resume-download" href="{{ .Params.asset.path }}" target="_blank" rel="noopener noreferrer">view resume (pdf)<span class="external-link-icon" aria-hidden="true"></span></a></p>
		{{ with .Content }}
			<div class="prose">{{ . }}</div>
		{{ end }}
	</article>
</main>
{{ end }}
