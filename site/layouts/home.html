{{ define "main" }}
<main class="site-main page-main-centered home-page" id="main-content">
	<section class="home-introduction" aria-labelledby="home-title">
		<h1 id="home-title">
			{{ partial "brand-mark.html" (dict "name" "sketch" "class" "home-mark" "alt" "Anna Noelle") }}
		</h1>
		<ul class="home-social-links" aria-label="social links">
			{{ range hugo.Data.publication.socialLinks }}
				<li><a class="home-social-link" href="{{ .href }}"{{ if ne .service "email" }} rel="me"{{ end }}>{{ partial "social-icon.html" .service }}<span>{{ .label }}</span></a></li>
			{{ end }}
		</ul>
	</section>
</main>
{{ end }}
