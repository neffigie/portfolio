{{ define "main" }}
{{ $posts := partial "listed-posts.html" . }}
<main class="site-main index-page" id="main-content" data-index-root>
	<h1>{{ .Title }}</h1>
	<p>{{ .Params.previewText }}</p>
	<form class="search-filters" data-search-filters role="search">
		<label>
			<span>Search</span>
			<input type="search" name="q" autocomplete="off" data-search-query>
		</label>
		<label>
			<span>Type</span>
			<select name="type" data-search-type>
				<option value="">All types</option>
				<option value="writing">Writing</option>
				<option value="project">Projects</option>
			</select>
		</label>
		{{ partial "tag-picker.html" $posts }}
		<label>
			<span>Sort</span>
			<select name="sort" data-search-sort>
				<option value="newest">Newest</option>
				<option value="oldest">Oldest</option>
				<option value="title">Title</option>
				<option value="relevance">Relevance</option>
			</select>
		</label>
	</form>
	<p class="search-status" role="status" aria-live="polite" data-search-status>{{ len $posts }} {{ cond (eq (len $posts) 1) "result" "results" }}</p>
	<ul class="search-results" data-search-results>
		{{ range $posts }}
			{{ partial "index-row.html" . }}
		{{ end }}
	</ul>
	<button type="button" data-search-more hidden>Show more results</button>
</main>
{{ end }}
