{{ define "main" }}
{{ $posts := partial "listed-posts.html" . }}
<main class="site-main index-page" id="main-content" data-index-root>
	<h1>{{ .Title }}</h1>
	<form class="search-filters" data-search-filters role="search">
		<div class="posts-query-bar">
			<label class="visually-hidden" for="posts-query">search posts</label>
			<svg class="posts-query-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
			<input id="posts-query" type="search" name="q" placeholder="search posts" autocomplete="off" data-search-query>
			<details class="posts-filter-disclosure">
				<summary aria-label="filters, none active" data-filter-summary><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M7 12h10m-7 6h4"/></svg><span class="filter-label">filters</span><span class="filter-count" data-filter-count hidden>0</span></summary>
			</details>
			<div class="posts-filter-panel">
					<label>
						<span>type</span>
						<select class="filter-value-control" name="type" data-search-type>
							<option value="">all types</option>
							<option value="writing">writing</option>
							<option value="project">projects</option>
						</select>
					</label>
					{{ partial "tag-picker.html" $posts }}
					<label>
						<span>sort</span>
						<select class="filter-value-control" name="sort" data-search-sort>
							<option value="newest">newest</option>
							<option value="oldest">oldest</option>
							<option value="title">title</option>
							<option value="relevance">relevance</option>
						</select>
					</label>
			</div>
		</div>
	</form>
	<p class="search-status" role="status" aria-live="polite" data-search-status>{{ len $posts }} {{ cond (eq (len $posts) 1) "result" "results" }}</p>
	<ul class="search-results" data-search-results>
		{{ range $posts }}
			{{ partial "index-row.html" . }}
		{{ end }}
	</ul>
	<button type="button" data-search-more hidden>show more results</button>
</main>
{{ end }}
