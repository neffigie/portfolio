version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install --skip-default-packages 24.21.0 && nvm use 24.21.0
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - HUGO_BINARY=./node_modules/.bin/hugo npm run build:site:pocketbase
  artifacts:
    baseDirectory: site/public
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
