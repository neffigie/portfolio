version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.21.0 && nvm use 24.21.0
        - npm ci
    build:
      commands:
        - HUGO_BINARY=./node_modules/.bin/hugo npm run build:site:pocketbase
  artifacts:
    baseDirectory: site/public
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
